# .github/workflows/pages_deploy.yml
# ----------------------------------------------------------
# Publishes the FULL site (repo root) to GitHub Pages
# whenever the self_hosted branch receives a push, which is
# how badge exports land. Manual dispatch is kept.
#
# Important:
# - Uses a single deploy job; once started it will not be canceled.
#   A burst of pushes collapses to one running deploy plus one pending.
# - .nojekyll ensures JSON endpoints (e.g., /badges/*.json) work.
# ----------------------------------------------------------

name: Pages Deploy

on:
  push:
    branches:
      - self_hosted
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    name: Deploy full site (root)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    # Let a deploy finish once it starts; avoid starvation.
    concurrency:
      group: pages-deploy-live
      cancel-in-progress: false

    steps:
      - name: Checkout site (self_hosted)
        uses: actions/checkout@v4
        with:
          ref: self_hosted

      # Keep JSON/raw endpoints (e.g., /badges/*.json) intact
      - name: Ensure no Jekyll processing
        run: touch .nojekyll

      - name: Upload Pages artifact (root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
