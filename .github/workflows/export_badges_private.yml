---

name: Export Private Repo Badges IaC

on:
  workflow_call:
    inputs:
      repo_name:
        required: true
        type: string
    secrets:
      BADGE_PUSH_TOKEN:
        required: true

jobs:
  export:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && startsWith(inputs.repo_name, 'ansible-lockdown/Private-')) || (github.event_name == 'push' && github.ref_name == 'latest')
    runs-on: ${{ startsWith(github.repository, 'ansible-lockdown/Private-') && 'self-hosted' || 'ubuntu-latest' }}

    steps:
      - name: Clean workspace
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +

      - name: Install GitHub CLI and jq
        run: |
          gh_ver=2.102.0
          jq_ver=1.8.2
          case "$(uname -m)" in
            x86_64)
              arch=amd64
              gh_sha=bb766f710eef8ede859c18578c72c327597cd4c8a85b06001b1f3843c6019386
              jq_sha=b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f
              ;;
            aarch64|arm64)
              arch=arm64
              gh_sha=7862c86c72f43df3a2d93ddde6f473285b4e2af61b494849846827e513ef6484
              jq_sha=8b85c817833814ddca00a144c33705546355afccf0cf39b188f3cdb48b852309
              ;;
            *)
              echo "Unsupported architecture: $(uname -m)"
              exit 1
              ;;
          esac
          for tool in curl tar sha256sum gh jq; do
            printf '%s: %s\n' "$tool" "$(command -v "$tool" || echo missing)"
          done
          cache="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/lockdown-badge-tools"
          bin="$RUNNER_TEMP/lockdown-bin"
          mkdir -p "$cache" "$bin"
          fetch() {
            if [ ! -f "$cache/$2" ]; then
              curl -fsSL -o "$cache/$2.part" "$1" && mv "$cache/$2.part" "$cache/$2"
            fi
            if [ "$(sha256sum "$cache/$2" | cut -d' ' -f1)" != "$3" ]; then
              echo "Checksum mismatch for $2, removing it."
              rm -f "$cache/$2"
              exit 1
            fi
          }
          if command -v gh >/dev/null 2>&1; then
            echo "gh found at $(command -v gh)"
          else
            gh_pkg="gh_${gh_ver}_linux_${arch}"
            fetch "https://github.com/cli/cli/releases/download/v${gh_ver}/${gh_pkg}.tar.gz" "${gh_pkg}.tar.gz" "$gh_sha"
            tar -xzf "$cache/${gh_pkg}.tar.gz" -C "$RUNNER_TEMP" "${gh_pkg}/bin/gh"
            install -m 0755 "$RUNNER_TEMP/${gh_pkg}/bin/gh" "$bin/gh"
            echo "gh ${gh_ver} installed from the checksum-verified release"
          fi
          if command -v jq >/dev/null 2>&1; then
            echo "jq found at $(command -v jq)"
          else
            fetch "https://github.com/jqlang/jq/releases/download/jq-${jq_ver}/jq-linux-${arch}" "jq-${jq_ver}-linux-${arch}" "$jq_sha"
            install -m 0755 "$cache/jq-${jq_ver}-linux-${arch}" "$bin/jq"
            echo "jq ${jq_ver} installed from the checksum-verified release"
          fi
          echo "$bin" >> "$GITHUB_PATH"

      - name: Create output directory
        run: |
          repo_short=$(basename "${{ inputs.repo_name }}")
          mkdir -p output/badges/$repo_short

      ##################################################
      #              Generate Badge Files              #
      ##################################################

      - name: Generate badge JSON files
        env:
          GH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
        run: |
          repo_short=$(basename "${{ inputs.repo_name }}")
          OUT_DIR=output/badges/$repo_short

          # Release branch badge
          default_branch=$(gh repo view "${{ inputs.repo_name }}" --json defaultBranchRef --jq '.defaultBranchRef.name')
          echo '{ "schemaVersion": 1, "label": "Release Branch", "message": "'"$default_branch"'", "color": "brightgreen" }' > $OUT_DIR/release-branch.json

          ##################################################
          #     Windows / Linux Private Pipeline Badges    #
          ##################################################

          # Windows Remediate Pipeline Badge
          status=$(gh run list -R "${{ inputs.repo_name }}" --workflow="main_pipeline_validation.yml" --json status,conclusion --jq '.[0] | .status + ":" + .conclusion' || echo "unknown:unknown")
          if [[ "$status" == "completed:success" ]]; then
            color=brightgreen; msg=Passing
          elif [[ "$status" == "completed:failure" ]]; then
            color=red; msg=Failing
          else
            color=lightgrey; msg=Unknown
          fi
          echo '{ "schemaVersion": 1, "label": "Remediate Pipeline", "message": "'"$msg"'", "color": "'"$color"'" }' > $OUT_DIR/remediate.json

          ##################################################
          #         Windows GPO Pipeline Badges Only       #
          ##################################################

          # Windows GPO Pipeline Badge
          echo "Checking repo_short: $repo_short"  # Debugging step
          if [[ "$repo_short" == Private-Windows-* ]]; then
            echo "Repo matches Private-Windows-* pattern"  # Debugging step

            # Fetch the status of the pipeline run
            status=$(gh run list -R "${{ inputs.repo_name }}" --workflow="main_pipeline_validation_gpo.yml" --json status,conclusion --jq '.[0] | .status + ":" + .conclusion' || echo "unknown:unknown")
            echo "Fetched status: $status"  # Debugging step

            # Set the badge color based on the status
            if [[ "$status" == "completed:success" ]]; then
              color=brightgreen
              msg=Passing
            elif [[ "$status" == "completed:failure" ]]; then
              color=red
              msg=Failing
            else
              color=lightgrey
              msg=Unknown
            fi

            # Output the badge JSON
            echo '{ "schemaVersion": 1, "label": "GPO Pipeline", "message": "'"$msg"'", "color": "'"$color"'" }' > $OUT_DIR/gpo.json
          else
            echo "Skipping GPO Pipeline badge — not a Windows repo"
          fi

          ##################################################
          #                Repo Metadata Badges            #
          ##################################################

          # Pull requests
          prs=$(gh pr list -R "${{ inputs.repo_name }}" --json number --jq 'length')
          echo '{ "schemaVersion": 1, "label": "Pull Requests", "message": "'"$prs"'", "color": "blue" }' > $OUT_DIR/prs.json

          # Closed issues
          closed=$(gh issue list -R "${{ inputs.repo_name }}" --state closed --json number --jq 'length')
          echo '{ "schemaVersion": 1, "label": "Closed Issues", "message": "'"$closed"'", "color": "success" }' > $OUT_DIR/issues-closed.json

          # Benchmark version badge
          echo "Reading README.md from the latest branch of ${{ inputs.repo_name }} to extract version..."
          if ! readme=$(gh api -H "Accept: application/vnd.github.raw" "repos/${{ inputs.repo_name }}/contents/README.md?ref=latest" 2>/dev/null); then
            version="Unknown"
            echo "README.md not found"
          else
            version=$(printf '%s\n' "$readme" | grep -Eo 'v[0-9]+\.[0-9]+\.[0-9]+' | head -n1)
            if [ -z "$version" ]; then
              version=$(printf '%s\n' "$readme" | grep -Eo 'Version [0-9]+, Rel [0-9]+' | head -n1)
            fi
          fi

          if [ -z "$version" ]; then version="Unknown"; fi

          echo "Extracted Benchmark Version: $version"
          echo '{ "schemaVersion": 1, "label": "Benchmark Version", "message": "'"$version"'", "color": "blue" }' > $OUT_DIR/benchmark-version.json

          # Last updated badge
          date_str=$(date -u +"%Y-%m-%dT%H:%MZ")
          echo '{ "schemaVersion": 1, "label": "Last Updated", "message": "'"$date_str"'", "color": "blue" }' > $OUT_DIR/last-updated.json

      ##################################################
      #             GitHub Pages Output Prep           #
      ##################################################

      - name: Add .nojekyll to prevent GitHub Pages filtering
        run: touch output/.nojekyll

      - name: Publish badge files through the GitHub API
        env:
          GH_TOKEN: ${{ secrets.BADGE_PUSH_TOKEN }}
        run: |
          repo_short=$(basename "${{ inputs.repo_name }}")
          branch="${BADGE_BRANCH:-self_hosted}"
          api="repos/ansible-lockdown/github_linux_IaC"
          src="output/badges/$repo_short"
          dir="badges/$repo_short"

          if [ ! -d "$src" ]; then
            echo "Warning: No badge output found in $src"
            exit 0
          fi
          new_files=$(find "$src" -maxdepth 1 -type f -name '*.json' -exec basename {} \; | sort)
          echo "Badge files to publish:"
          echo "$new_files"

          for attempt in 1 2 3 4 5; do
            head=$(gh api "$api/git/ref/heads/$branch" --jq .object.sha)
            base_tree=$(gh api "$api/git/commits/$head" --jq .tree.sha)
            existing=$(gh api "$api/contents/$dir?ref=$head" --jq '.[] | select(.type == "file") | .name' 2>/dev/null) || existing=""

            entries=$(
              for f in $new_files; do
                jq -n --arg path "$dir/$f" --rawfile content "$src/$f" '{path: $path, mode: "100644", type: "blob", content: $content}'
              done
              for f in $existing; do
                if ! grep -qxF "$f" <<< "$new_files"; then
                  echo "Removing stale badge file $dir/$f" >&2
                  jq -n --arg path "$dir/$f" '{path: $path, mode: "100644", type: "blob", sha: null}'
                fi
              done
            )
            new_tree=$(jq -s --arg base "$base_tree" '{base_tree: $base, tree: .}' <<< "$entries" | gh api -X POST "$api/git/trees" --input - --jq .sha)

            if [ "$new_tree" = "$base_tree" ]; then
              echo "No changes detected - skipping commit."
              exit 0
            fi

            commit=$(jq -n --arg msg "Update PRIVATE badges for $repo_short" --arg tree "$new_tree" --arg parent "$head" \
              '{message: $msg, tree: $tree, parents: [$parent], author: {name: "GitHub Actions", email: "actions@github.com"}}' \
              | gh api -X POST "$api/git/commits" --input - --jq .sha)

            if gh api -X PATCH "$api/git/refs/heads/$branch" -f sha="$commit" -F force=false --silent; then
              echo "Published $commit to $branch"
              exit 0
            fi
            echo "Branch $branch moved before the update, retrying ($attempt/5)"
            sleep $((attempt * 5))
          done
          echo "Publishing to $branch failed after 5 attempts."
          exit 1

      - name: Remove workspace clones
        if: always()
        run: find "$GITHUB_WORKSPACE" -mindepth 1 -maxdepth 1 -exec rm -rf {} +
